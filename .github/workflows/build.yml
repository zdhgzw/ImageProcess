name: Cross-Platform Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
        sudo apt-get install -y libopencv-dev
        sudo apt-get install -y libx11-dev libgtk-3-dev
        
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        
    - name: Build
      run: |
        cmake --build build --config ${{ matrix.build_type }} -j$(nproc)
        
    - name: Test executable
      run: |
        ls -la build/bin/
        file build/bin/ImageProcessingApp
        ldd build/bin/ImageProcessingApp
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: linux-${{ matrix.build_type }}
        path: build/bin/ImageProcessingApp

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-opencv
          mingw-w64-x86_64-pkg-config
          
    - name: Build with MinGW
      shell: msys2 {0}
      run: |
        cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        cmake --build build --config ${{ matrix.build_type }} -j$env:NUMBER_OF_PROCESSORS
        
    - name: Test executable
      shell: msys2 {0}
      run: |
        ls -la build/bin/
        file build/bin/ImageProcessingApp.exe
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: windows-${{ matrix.build_type }}
        path: build/bin/ImageProcessingApp.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        brew install cmake opencv
        
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        
    - name: Build
      run: |
        cmake --build build --config ${{ matrix.build_type }} -j$(sysctl -n hw.ncpu)
        
    - name: Test executable
      run: |
        ls -la build/bin/
        file build/bin/ImageProcessingApp
        otool -L build/bin/ImageProcessingApp
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: macos-${{ matrix.build_type }}
        path: build/bin/ImageProcessingApp

  test-build-scripts:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libopencv-dev
        
    - name: Test build script
      run: |
        chmod +x build.sh test_build.sh
        ./test_build.sh
        
    - name: Test clean build
      run: |
        ./build.sh clean release
        test -f build/bin/ImageProcessingApp
